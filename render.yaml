# API de reserva do Atlas.
#
# ── Para que serve ──────────────────────────────────────────────────
# O back-end principal é o notebook, exposto por túnel: rápido, com o
# Postgres na mesma máquina, e é onde os dados nascem. Mas ele desliga.
# Esta instância existe para o produto continuar de pé nesse intervalo —
# apontando para o Neon, que a sincronização (outbox → CLOUD) mantém
# atualizado.
#
# Os clientes tentam o notebook primeiro e caem para cá sozinhos; a
# lógica está em `endpoint.ts`, no web e no app.
#
# ── Como usar ───────────────────────────────────────────────────────
# 1. render.com → New → Blueprint → aponte para este repositório.
# 2. O Render lê este arquivo e cria o serviço.
# 3. Preencha no painel os valores marcados como `sync: false`.
#
# ── O que esperar do plano gratuito ─────────────────────────────────
# O serviço HIBERNA após ~15 min sem requisição, e a primeira chamada
# depois disso leva uns 50 s para responder. Para uma reserva isso é
# aceitável — mas explica por que os clientes sondam com timeout curto
# em vez de esperar: sem o corte, o usuário encara a tela girando.

services:
  - type: web
    name: atlas-api-reserva
    runtime: node
    plan: free
    region: oregon
    branch: main

    # `corepack pnpm ...`, e NÃO `corepack enable`.
    #
    # O `enable` instala um atalho global em /usr/bin, que no Render é
    # somente leitura — o build morre em
    # "EROFS: read-only file system, unlink '/usr/bin/pnpm'".
    # Chamado direto, o corepack executa o pnpm da versão fixada em
    # `packageManager` sem instalar nada fora do projeto.
    buildCommand: >-
      corepack pnpm install --frozen-lockfile &&
      corepack pnpm db:generate &&
      corepack pnpm --filter "@atlas/api..." build

    startCommand: node apps/api/dist/main.js

    healthCheckPath: /api/health/live

    envVars:
      - key: NODE_ENV
        value: production

      # O corepack pergunta antes de baixar o pnpm na primeira execução.
      # Sem TTY para responder, o build ficaria pendurado até o timeout.
      - key: COREPACK_ENABLE_DOWNLOAD_PROMPT
        value: '0'

      # Node 22: o `corepack` só vem embutido a partir do 16, e o
      # projeto exige >=20.11 (engines). Fixar evita o Render escolher
      # uma versão antiga e falhar em sintaxe moderna.
      - key: NODE_VERSION
        value: '22'

      # Sem Postgres local aqui: o Neon é o principal desta instância.
      - key: DATABASE_PRIMARY
        value: CLOUD

      - key: API_HOST
        value: 0.0.0.0

      # API_PORT não aparece aqui de propósito: o Render injeta a porta
      # em `PORT`, e o `parseEnv` usa esse valor quando `API_PORT` não
      # está definido. Fixar um número aqui faria o serviço escutar na
      # porta errada e o deploy morrer em "no open ports detected".

      # Em servidor, origem "privada" não é o seu notebook — é outra
      # máquina do datacenter.
      - key: CORS_ALLOW_LAN
        value: 'false'

      - key: CORS_ORIGINS
        value: https://atlas-academia.vercel.app,https://*.vercel.app

      # ── Preencher no painel (nunca no git) ──────────────────────────
      # Gere os JWT com: node infra/scripts/gerar-segredos.mjs
      - key: DATABASE_URL_CLOUD
        sync: false

      # ATENÇÃO: aqui vai a MESMA string do Neon, não a do seu .env.
      #
      # O nome vem do ambiente de desenvolvimento, onde aponta para o
      # Postgres do docker-compose — mas é ele o datasource do Prisma, e
      # nesta máquina não existe Postgres local. Copiar o valor do .env
      # (localhost:5433) faz a API subir, o health check estourar por
      # timeout e o deploy morrer em "service unhealthy", sem dizer que o
      # banco é inalcançável. O schema de ambiente recusa esse valor em
      # produção justamente para o erro aparecer no boot, com explicação.
      - key: DATABASE_URL_LOCAL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: REDIS_URL
        sync: false

      # Documentação: sem estas duas, a API NÃO serve /docs em produção.
      - key: DOCS_USER
        sync: false
      - key: DOCS_PASSWORD
        sync: false
